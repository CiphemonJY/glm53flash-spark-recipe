# haproxy.cfg - GLM gateway (adapted). Phase-1 truth: ONE endpoint exists
# (variant A TP=4 head on primary:8888), so backend = single server; the
# recipe's 4-way split becomes live only in phase-2 PD-disagg after
# sgl-router bootstrap. Health checks match sglang endpoints.
global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    user haproxy
    group haproxy
    daemon
    maxconn 100000

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 15s
    timeout client  45m     # long LLM streams
    timeout server  45m

frontend llm_gateway
    bind 0.0.0.0:80
    monitor-uri /healthz
    default_backend glm_t4

backend glm_t4
    mode http
    balance leastconn
    option httpchk GET /v1/models          # sglang answers this pre-load too;
                                           # swap to /health after warmup
    http-check expect status 200

    # PRIMARY: TP=4 head node (only serving endpoint in variant A)
    server glm-head-primary 192.168.88.11:8888 check maxconn 1024

    # PHASE-2 placeholders (PD-disagg decode instances, once sgl-router +
    # bootstrap registry exist):
    # server glm-decode-4 192.168.88.14:8884 check maxconn 1024 backup
