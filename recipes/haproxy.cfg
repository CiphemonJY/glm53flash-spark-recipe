# haproxy.cfg - optional gateway in front of the GLM serve.
# Phase-1 reality: a TP=4 instance has ONE endpoint (the rank-0 head), so the
# backend is a single server. A multi-backend split only becomes possible with
# phase-2 PD-disaggregation (sgl-router) serving multiple decode instances.
# Replace 10.0.0.11 with your head node's IP.
global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    user haproxy
    group haproxy
    daemon
    maxconn 100000

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 15s
    timeout client  45m     # long LLM streams
    timeout server  45m

frontend llm_gateway
    bind 0.0.0.0:80
    monitor-uri /healthz
    default_backend glm_t4

backend glm_t4
    mode http
    balance leastconn
    option httpchk GET /v1/models          # sglang answers this pre-load too;
                                           # swap to /health after warmup
    http-check expect status 200

    # rank-0 head node - the only serving endpoint in a TP=4 deployment
    server glm-head 10.0.0.11:8888 check maxconn 1024

    # PHASE-2 placeholders (PD-disagg decode instances, once sgl-router +
    # a bootstrap registry exist):
    # server glm-decode-2 10.0.0.14:8884 check maxconn 1024 backup
