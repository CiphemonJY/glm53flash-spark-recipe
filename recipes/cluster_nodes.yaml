# cluster_nodes.yaml - cluster MAP template for a GLM-5.3-Flash TP=4 serve.
# The engine does NOT read this file: the sglang image takes --nnodes /
# --node-rank / --dist-init-addr on the CLI (see variant_a_ip.sh, which takes
# HEAD_IP / WORKER_IPS from env). Keep this as the operator's authoritative
# map of YOUR cluster; the IPs below are placeholders.
#
# PHYSICS NOTE: FP8 weights are ~330 GB. On 4x DGX Spark GB10 (128 GB unified
# memory each, ~85 GB usable per rank after headroom) every serving instance
# needs ALL FOUR nodes - a "3-node mesh + solo decode node" cannot hold the
# model. Topology = classic TP=4. PD-disaggregation only makes sense if the
# instance still shards across >= 4 nodes total.
cluster:
  head_node:                     # rank 0: dist-init endpoint + API server
    ip: "10.0.0.11"              # EXAMPLE - replace with your fabric IP
    port: 22
  worker_nodes:                  # ranks 1-3, started BEFORE the head
    - ip: "10.0.0.12"
      port: 22
    - ip: "10.0.0.13"
      port: 22
    - ip: "10.0.0.14"
      port: 22

scheduling:
  enable_chunked_prefill: true
  max_num_seqs: 1024             # ambition only: the hybrid-KDA mamba state
                                 # capped real admissions much lower on the
                                 # reference cluster (see README cautions)

fabric:
  mtu: 9000                      # jumbo frames on the fabric interfaces
  ring_buffers: swap_window_only # ethtool -G pauses the queue: stop-window only
  sysctl_buffers: tune_network_SAFE.sh   # safe beside a live serve
