# cluster_nodes.yaml - GLM-5.3-Flash fleet map (adapted from user recipe)
# REALITY NOTES vs original example:
#  - This engine (sglang glm-5.3-flash image) uses --nnodes/--node-rank/
#    --dist-init-addr CLI args, NOT this YAML; file kept as authoritative
#    cluster MAP for operators and future vLLM>=new-API runs.
#  - Model is 320B-total/A18B FP8 (~330GB). Weight physics FORCE full-width
#    sharding: every serving instance needs ALL FOUR nodes (85GB/node).
#    A "3-node mesh + solo decode node" cannot hold this model on GB10
#    (128GB unified - 15% headroom). Topology therefore = TP=4 classic now;
#    PD-disagg (prefill x / decode y widths) revisits only if instance can
#    still shard across >=4 nodes total.
cluster:
  head_node:
    ip: "192.168.88.11"        # dgx-primary (spark-1) ds4 head today
    port: 22
  worker_nodes:
    - ip: "192.168.88.12"      # dgx-secondary (spark-2)
      port: 22
    - ip: "192.168.88.13"      # dgx-3
      port: 22
    - ip: "192.168.88.14"      # dgx-4 (downloaded source-of-truth weights)
      port: 22

scheduling:
  enable_chunked_prefill: true          # supported in sglang by default path
  max_num_seqs: 1024                    # ambition; sglang launches dynamic,
                                        # set explicitly during tuning pass
fabric:
  mtu: 9000                             # already active on enp1s0f1np1
  ring_buffers: pending_swap_window     # ethtool -G rx4096 tx4096 after ds4 stop
  sysctl_buffers: APPLIED_20260727      # /etc/sysctl.d/99-glm-net.conf all nodes
